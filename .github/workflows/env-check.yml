name: TEMP - env check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call env-check endpoint
        run: |
          curl --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.ZUKE_BASE_URL }}/api/cron/env-check"

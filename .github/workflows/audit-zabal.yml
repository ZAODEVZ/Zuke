name: TEMP - audit zabal recordings
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call audit endpoint
        run: |
          curl --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.ZUKE_BASE_URL }}/api/cron/audit-zabal-recordings"
